    <link rel="apple-touch-icon" href="/logo/quadups-black-small-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#870a81" />

    <meta name="googlebot" content="index, follow" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://formspree.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://formspree.io" />

    <title>Quadups Ltd - Custom Software Development & Digital Solutions | UK & Nigeria</title>
    <meta name="description" content="Leading software development company in UK and Nigeria. We build custom web apps, mobile apps, AI/ML solutions, and provide startup-as-a-service. Transform your business with cutting-edge technology." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (localStorage.getItem("theme") === "dark" || 
          (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>    
  </body>
</html>
